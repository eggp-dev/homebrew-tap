name: Follow Conn releases
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Point the cask at the newest published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Commit when it changed
        run: |
          git diff --quiet && exit 0
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/conn.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "conn $version"
          git push
          # A push made with the workflow token starts no other workflow, so the real
          # install test has to be asked for; dispatching it is allowed.
          gh workflow run test.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
